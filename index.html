<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Nguyen Dinh Trung</title>
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/73766127?s=400&u=1506152475ed0c87017eac4a3859d9a95f3d3f02&v=4">
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mui/material@5.16.7/umd/material-ui.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
    <style>
        .fade-in {
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hover-scale {
            transition: transform 0.3s ease;
        }
        .hover-scale:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { Container, AppBar, Toolbar, Typography, Button, IconButton, Grid, Card, CardContent, CardMedia, Switch, CssBaseline, ThemeProvider, createTheme } = MaterialUI;

        const lightTheme = createTheme({
            palette: {
                mode: 'light',
                primary: { main: '#4CAF50' },
                secondary: { main: '#45a049' },
                background: { default: '#f9f9f9' }
            }
        });

        const darkTheme = createTheme({
            palette: {
                mode: 'dark',
                primary: { main: '#66BB6A' },
                secondary: { main: '#4CAF50' },
                background: { default: '#1a202c', paper: '#2d3748' }
            }
        });

        const navItems = [
            { label: 'About', id: 'about' },
            { label: 'Skills', id: 'skills' },
            { label: 'Projects', id: 'projects' },
            { label: 'Contact', id: 'contact' }
        ];

        const Header = ({ theme }) => (
            <header className={`bg-gradient-to-r ${theme.palette.mode === 'dark' ? 'from-gray-800 to-gray-900' : 'from-green-500 to-green-600'} text-white py-32 text-center`}>
                <Container>
                    <Typography variant="h1" className="text-5xl md:text-6xl font-bold mb-4 fade-in">
                        Nguyen Dinh Trung
                    </Typography>
                    <Typography variant="h5" className="opacity-90 text-lg md:text-xl">
                        Software Engineer
                    </Typography>
                </Container>
            </header>
        );

        const Nav = ({ theme, toggleTheme }) => {
            const handleScroll = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            };

            return (
                <AppBar position="sticky" className={`${theme.palette.mode === 'dark' ? 'bg-gray-800' : 'bg-white'} shadow-lg`}>
                    <Toolbar className="justify-between">
                        <div className="flex">
                            {navItems.map((item) => (
                                <Button
                                    key={item.id}
                                    onClick={() => handleScroll(item.id)}
                                    className={`mx-2 ${theme.palette.mode === 'dark' ? 'text-gray-200 hover:text-green-400' : 'text-gray-800 hover:text-green-500'}`}
                                >
                                    {item.label}
                                </Button>
                            ))}
                        </div>
                        <div className="flex items-center">
                            <Typography variant="body2" className={`mr-2 ${theme.palette.mode === 'dark' ? 'text-gray-200' : 'text-gray-800'}`}>
                                {theme.palette.mode === 'light' ? 'Dark Mode' : 'Light Mode'}
                            </Typography>
                            <Switch checked={theme.palette.mode === 'dark'} onChange={toggleTheme} color="primary" />
                        </div>
                    </Toolbar>
                </AppBar>
            );
        };

        const About = ({ theme }) => (
            <section id="about" className={`py-24 ${theme.palette.mode === 'dark' ? 'bg-gray-900' : 'bg-gray-50'}`}>
                <Container>
                    <Typography variant="h2" className={`text-4xl ${theme.palette.mode === 'dark' ? 'text-green-400' : 'text-white'} text-center mb-12 font-bold fade-in`}>
                        About Me
                    </Typography>
                    <Grid container justifyContent="center">
                        <Grid item xs={12} md={8}>
                            <Typography variant="body1" className={`text-center ${theme.palette.mode === 'dark' ? 'text-gray-300' : 'text-gray-700'} fade-in`}>
                                Hello, I'm Nguyen Dinh Trung, a passionate software engineer dedicated to creating innovative solutions. I'm currently focusing on web and mobile application development, specializing in Java. I'm always seeking new challenges to enhance my skills and grow as a developer.
                            </Typography>
                        </Grid>
                    </Grid>
                </Container>
            </section>
        );

        const Skills = ({ theme }) => {
            const skills = [
                "HTML, CSS, JavaScript",
                "Java, Spring Boot",
                "Python, Pandas",
                "MSSQL, MySQL",
                "Git, GitHub",
                "Responsive Web Design"
            ];

            return (
                <section id="skills" className={`py-24 ${theme.palette.mode === 'dark' ? 'bg-gray-800' : 'bg-white'}`}>
                    <Container>
                        <Typography variant="h2" className={`text-4xl ${theme.palette.mode === 'dark' ? 'text-green-400' : 'text-green-700'} text-center mb-12 font-bold fade-in`}>
                            Skills
                        </Typography>
                        <Grid container spacing={3}>
                            {skills.map((skill, index) => (
                                <Grid item xs={12} sm={6} md={4} key={index}>
                                    <Card className={`hover-scale ${theme.palette.mode === 'dark' ? 'bg-gray-700' : 'bg-white'} shadow-lg`}>
                                        <CardContent>
                                            <Typography variant="h6" className={theme.palette.mode === 'dark' ? 'text-gray-200' : 'text-gray-800'}>
                                                {skill}
                                            </Typography>
                                        </CardContent>
                                    </Card>
                                </Grid>
                            ))}
                        </Grid>
                    </Container>
                </section>
            );
        };

        const Projects = ({ theme }) => {
            const projects = [
                {
                    title: "Motorcycle Sales Website",
                    description: "Developed a dynamic e-commerce platform for motorcycle sales at dinhtrung0902.id.vn. The website features a user-friendly interface, product catalog, and secure payment integration. Built using HTML, CSS, JavaScript, and PHP with MySQL database.",
                    image: "Images/project1.jpg",
                    link: "http://dinhtrung0902.id.vn"
                },
                {
                    title: "Coming soon",
                    description: "Coming soon",
                    image: "https://via.placeholder.com/300x200"
                }
            ];

            return (
                <section id="projects" className={`py-24 ${theme.palette.mode === 'dark' ? 'bg-gray-900' : 'bg-gray-50'}`}>
                    <Container>
                        <Typography variant="h2" className={`text-4xl ${theme.palette.mode === 'dark' ? 'text-green-400' : 'text-green-700'} text-center mb-12 font-bold fade-in`}>
                            Projects
                        </Typography>
                        <Grid container spacing={4}>
                            {projects.map((project, index) => (
                                <Grid item xs={12} sm={6} key={index}>
                                    <Card className={`hover-scale ${theme.palette.mode === 'dark' ? 'bg-gray-700' : 'bg-white'} shadow-lg`}>
                                        <CardMedia
                                            component="img"
                                            height="200"
                                            image={project.image}
                                            alt={project.title}
                                            className="object-cover"
                                        />
                                        <CardContent>
                                            <Typography variant="h5" className={`mb-2 ${theme.palette.mode === 'dark' ? 'text-green-400' : 'text-green-700'} font-semibold`}>
                                                {project.title}
                                            </Typography>
                                            <Typography variant="body2" className={`mb-4 ${theme.palette.mode === 'dark' ? 'text-gray-300' : 'text-gray-700'}`}>
                                                {project.description}
                                            </Typography>
                                            {project.link && (
                                                <Button
                                                    variant="contained"
                                                    className={`bg-green-500 hover:bg-green-600 ${theme.palette.mode === 'dark' ? 'bg-green-600 hover:bg-green-700' : ''}`}
                                                    href={project.link}
                                                    target="_blank"
                                                >
                                                    Visit Website
                                                </Button>
                                            )}
                                        </CardContent>
                                    </Card>
                                </Grid>
                            ))}
                        </Grid>
                    </Container>
                </section>
            );
        };

        const Contact = ({ theme }) => (
            <section id="contact" className={`py-24 ${theme.palette.mode === 'dark' ? 'bg-gray-800' : 'bg-white'}`}>
                <Container>
                    <Typography variant="h2" className={`text-4xl ${theme.palette.mode === 'dark' ? 'text-green-400' : 'text-green-700'} text-center mb-12 font-bold fade-in`}>
                        Contact
                    </Typography>
                    <div className="flex justify-center gap-10">
                        <IconButton href="mailto:dinhtrung0902@gmail.com" className={`text-3xl ${theme.palette.mode === 'dark' ? 'text-green-400 hover:text-green-500' : 'text-green-500 hover:text-green-600'}`}>
                            <i className="fas fa-envelope"></i>
                        </IconButton>
                        <IconButton href="https://linkedin.com/in/dinhtrung0902" target="_blank" className={`text-3xl ${theme.palette.mode === 'dark' ? 'text-green-400 hover:text-green-500' : 'text-green-500 hover:text-green-600'}`}>
                            <i className="fab fa-linkedin"></i>
                        </IconButton>
                        <IconButton href="https://github.com/dinhtrung0902" target="_blank" className={`text-3xl ${theme.palette.mode === 'dark' ? 'text-green-400 hover:text-green-500' : 'text-green-500 hover:text-green-600'}`}>
                            <i className="fab fa-github"></i>
                        </IconButton>
                    </div>
                </Container>
            </section>
        );

        const Footer = ({ theme }) => (
            <footer className={`py-6 text-center ${theme.palette.mode === 'dark' ? 'bg-gray-900 text-gray-300' : 'bg-green-500 text-white'}`}>
                <Container>
                    <Typography variant="body2">
                        © {new Date().getFullYear()} Nguyen Dinh Trung. All rights reserved.
                    </Typography>
                </Container>
            </footer>
        );

        const App = () => {
            const [theme, setTheme] = useState(lightTheme);

            const toggleTheme = () => {
                setTheme(theme.palette.mode === 'light' ? darkTheme : lightTheme);
            };

            return (
                <ThemeProvider theme={theme}>
                    <CssBaseline />
                    <Header theme={theme} />
                    <Nav theme={theme} toggleTheme={toggleTheme} />
                    <main>
                        <About theme={theme} />
                        <Skills theme={theme} />
                        <Projects theme={theme} />
                        <Contact theme={theme} />
                    </main>
                    <Footer theme={theme} />
                </ThemeProvider>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
